defaults:
  - _self_
  # - task: vase_wiping_conv.yaml
  - task: flip_up_conv.yaml
  # - task: flip_up_conv_dinoV3.yaml
  # - task: smiley_single_arm.yaml
  - override hydra/sweeper: optuna

name: ${policy.obs_encoder.fuse_mode}_VIT_500V1_NEW_K_LABELS_15Nfhigh
output_dir: ${oc.env:PYRITE_CHECKPOINT_FOLDERS}
_target_: diffusion_policy.workspace.train_diffusion_unet_image_workspace.TrainDiffusionUnetImageWorkspace

task_name: ${task.name}
shape_meta: ${task.shape_meta}
exp_name: "default"

policy:
  _target_: diffusion_policy.policy.diffusion_unet_timm_mod1_policy.DiffusionUnetTimmMod1Policy

  shape_meta: ${shape_meta}

  noise_scheduler:
    _target_: diffusers.DDIMScheduler
    num_train_timesteps: 50
    beta_start: 0.0001
    beta_end: 0.02
    beta_schedule: squaredcos_cap_v2
    clip_sample: True
    set_alpha_to_one: True
    steps_offset: 0
    prediction_type: epsilon # epsilon | sample

  obs_encoder:
    _target_: diffusion_policy.model.vision.timm_obs_encoder_bi_cross_dat_V2.TimmObsEncoderWithForceV2
    shape_meta: ${shape_meta}
    fuse_mode: bi-cross-attention-ViDAT  # modality-attention | bi-cross-attention | bi-cross-attention-ViDAT
    reduce_pretrained_lr: True
    position_encoding: learnable  # learnable | null
    symbol_retriever: position_relative  # positional | position_relative | symbolic | relational_symbolic
    symbol_retriever_cfg:
      symbol_dim: 768  # must match v_feature_dim (d_model of ViDAT)
      max_rel_pos: 50  # vit_base_patch32: 7x7=49 patches + 1 CLS = 50 tokens per frame
    bi_cross_heads: 4
    n_heads_sa: 4  # sensory attention heads per ViDAT layer (even split recommended)
    n_heads_ra: 4  # relational attention heads per ViDAT layer (even split recommended)
    share_attn_params: False
    vidat_n_layers: 2  # ViDAT layers on patch tokens before fusion (paper recommends 2–3)
    dat_dff: 2048
    dat_activation: gelu  # relu | gelu | silu
    dat_dropout_rate: 0.0
    dat_norm_first: True
    dat_ra_kwargs:
      symmetric_rels: True  # symmetric relations recommended as starting point (ablate asymmetric)

    vision_encoder_cfg:
      model_name: 'vit_base_patch32_clip_224.openai'
      pretrained: True
      frozen: True  # backbone frozen; only ViDAT layers train from scratch
      global_pool: ''

      # downsample ratio for image tokens
      downsample_ratio: 32  # 16 for dinov3 | 32 for vit_base_patch32

      transforms:
        - type: RandomCrop
          ratio: 0.95
        - _target_: torchvision.transforms.ColorJitter
          brightness: 0.3
          contrast: 0.4
          saturation: 0.5
          hue: 0.08

      use_group_norm: True
      share_rgb_model: False

    force_encoder_cfg:
      type: fft      # fft | cnn1d
      feature_dim: 384  # fft: z_dim (output = 2*feature_dim = 768) | cnn1d: hidden_channels (output = feature_dim)
      frozen: False
      share_force_model: False
      # ── cnn1d-only fields (ignored when type: fft) ──────────────────
      # ft_dim: 6        # wrench input dimension
      # norm_type: group # group | batch | layer
      # act: gelu        # gelu | relu
      # alpha_init: 0.01

  num_inference_steps: 16
  diffusion_step_embed_dim: 32
  down_dims: [256,512,1024]
  kernel_size: 5
  n_groups: 8
  cond_predict_scale: True
  input_pertub: 0.0684854455525527
  train_diffusion_n_samples: 1

ema:
  _target_: diffusion_policy.model.diffusion.ema_model.EMAModel
  update_after_step: 0
  inv_gamma: 1.0
  power: 0.7820065419014919
  min_value: 0.0
  max_value: 0.9999

dataloader:
  batch_size: 128
  num_workers: 32
  shuffle: True
  pin_memory: True
  persistent_workers: false

val_dataloader:
  batch_size: 128
  num_workers: 32
  shuffle: False
  pin_memory: True
  persistent_workers: false

optimizer:
  _target_: torch.optim.AdamW
  lr: 0.00021031655633456552
  betas: [0.95, 0.999]
  eps: 1.0e-8
  weight_decay: 9.093294700385743e-05

training:
  device: "cuda:0"
  seed: 42
  debug: False
  resume: False
  lr_scheduler: cosine
  lr_warmup_steps: 1000
  num_epochs: 150

  log_gradient_norm: False

  gradient_accumulate_every: 1
  use_ema: True
  freeze_encoder: False
  rollout_every: 10
  checkpoint_every: 10
  val_every: 5
  sample_every: 5
  max_train_steps: null
  max_val_steps: null
  tqdm_interval_sec: 1.0


logging:
  project: Flip_up_V1_new_k_post
  resume: False
  mode: online
  name: ${now:%Y.%m.%d-%H.%M.%S}_${task_name}_${name}
  tags: ["${name}", "${task_name}", "${exp_name}"]
  id: null
  group: null

checkpoint:
  topk:
    monitor_key: val_sparse_naction_mse_error
    mode: min
    k: 20
    format_str: 'epoch={epoch:04d}-train_loss={train_loss:.3f}.ckpt'
  save_last_ckpt: True
  save_last_snapshot: False

multi_run:
  run_dir: ${output_dir}/${now:%Y.%m.%d}_${now:%H.%M.%S}_${task_name}_${name}
  wandb_name_base: ${now:%Y.%m.%d-%H.%M.%S}_${task_name}_${name}

hydra:
  sweeper:
    _target_: hydra_plugins.hydra_optuna_sweeper.optuna_sweeper.OptunaSweeper

    direction: minimize
    n_trials: 4
    n_jobs: 1

    sampler:
      _target_: optuna.samplers.TPESampler
      seed: 42

    params:
      #task.dataset_path: "${oc.env:PYRITE_DATASET_FOLDERS}/flip_up_230_original,${oc.env:PYRITE_DATASET_FOLDERS}/flip_up_230"

  job:
    override_dirname: ${name}
  run:
    dir: ${output_dir}/${now:%Y.%m.%d}_${now:%H.%M.%S}_${task_name}_${name}
  sweep:
    dir: ${output_dir}/${now:%Y.%m.%d}_${now:%H.%M.%S}_${task_name}_${name}
    subdir: ${hydra.job.num}
