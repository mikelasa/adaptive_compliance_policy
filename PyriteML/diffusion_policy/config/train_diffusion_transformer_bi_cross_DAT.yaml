defaults:
  - _self_
  - task: flip_up_conv.yaml
  - override hydra/sweeper: optuna

name: ${policy.obs_encoder.fuse_mode}_VIT_transformer_${policy.obs_encoder.force_encoder_cfg.type}
output_dir: ${oc.env:PYRITE_CHECKPOINT_FOLDERS}
_target_: diffusion_policy.workspace.train_diffusion_transformer_image_workspace.TrainDiffusionTransformerImageWorkspace

task_name: ${task.name}
shape_meta: ${task.shape_meta}
exp_name: "default"

policy:
  _target_: diffusion_policy.policy.diffusion_transformer_timm_mod1_policy.DiffusionTransformerTimmMod1Policy

  shape_meta: ${shape_meta}

  noise_scheduler:
    _target_: diffusers.DDIMScheduler
    num_train_timesteps: 50
    beta_start: 0.0001
    beta_end: 0.02
    beta_schedule: squaredcos_cap_v2
    clip_sample: True
    set_alpha_to_one: True
    steps_offset: 0
    prediction_type: epsilon

  obs_encoder:
    _target_: diffusion_policy.model.vision.timm_obs_encoder_bi_cross_dat_transformer.TimmObsEncoderBiCrossDATTransformer
    shape_meta: ${shape_meta}
    fuse_mode: bi-cross-attention-DAT  # modality-attention | bi-cross-attention | bi-cross-attention-DAT | DAT
    second_camera: false
    reduce_pretrained_lr: True
    position_encoding: learnable
    symbol_retriever: positional  # positional | position_relative | symbolic | relational_symbolic
    symbol_retriever_cfg:
      symbol_dim: 768  # must match v_feature_dim (ViT-B embed_dim)
      n_heads: 6
      n_symbols: 16
    bi_cross_heads: 4
    bi_cross_attn_drop: 0.1   # dropout on the cross-attention weights (img<->force)
    bi_cross_drop: 0.05       # dropout after the cross-attn residual + its FFN
    n_heads_sa: 8
    n_heads_ra: 8
    share_attn_params: False
    dat_n_layers: 4
    dat_dff: 2048
    dat_activation: relu
    dat_dropout_rate: 0.1
    dat_norm_first: True
    dat_ra_kwargs:
      symmetric_rels: True

    vision_encoder_cfg:
      model_name: 'vit_base_patch32_clip_224.openai'
      pretrained: True
      frozen: False
      global_pool: ''
      downsample_ratio: 32
      transforms:
        - type: RandomCrop
          ratio: 0.95
        - _target_: torchvision.transforms.ColorJitter
          brightness: 0.3
          contrast: 0.4
          saturation: 0.5
          hue: 0.08
      use_group_norm: True
      share_rgb_model: False

    force_encoder_cfg:
      type: cnn1d
      feature_dim: 768  # must match vision encoder embed_dim so tokens are compatible
      last_n_tokens: 1
      frozen: False
      share_force_model: False

  num_inference_steps: 16
  input_pertub: 0.0684854455525527
  # transformer denoiser architecture
  n_layer: 8
  n_head: 8
  n_emb: 768    # must match vision_encoder_cfg embed_dim and force_encoder_cfg feature_dim
  p_drop_attn: 0.1

ema:
  _target_: diffusion_policy.model.diffusion.ema_model.EMAModel
  update_after_step: 0
  inv_gamma: 1.0
  power: 0.75
  min_value: 0.0
  max_value: 0.9999

dataloader:
  batch_size: 128   # transformers need more memory per sample than UNet — start lower
  num_workers: 32
  shuffle: True
  pin_memory: True
  persistent_workers: false

val_dataloader:
  batch_size: 128
  num_workers: 32
  shuffle: False
  pin_memory: True
  persistent_workers: false

optimizer:
  _target_: torch.optim.AdamW
  lr: 1.0e-4
  betas: [0.9, 0.95]
  eps: 1.0e-8
  weight_decay: 1.0e-4

training:
  device: "cuda:0"
  seed: 42
  debug: False
  resume: False
  lr_scheduler: cosine
  lr_warmup_steps: 1000
  num_epochs: 150
  log_gradient_norm: False
  gradient_accumulate_every: 1
  use_ema: True
  freeze_encoder: False
  rollout_every: 10
  checkpoint_every: 10
  val_every: 5
  sample_every: 5
  max_train_steps: null
  max_val_steps: null
  tqdm_interval_sec: 1.0

logging:
  project: RACP_TILT
  resume: False
  mode: online
  name: ${now:%Y.%m.%d-%H.%M.%S}_${task_name}_${name}
  tags: ["${name}", "${task_name}", "${exp_name}"]
  id: null
  group: null

checkpoint:
  topk:
    monitor_key: val_sparse_naction_mse_error
    mode: min
    k: 20
    format_str: 'epoch={epoch:04d}-train_loss={train_loss:.3f}.ckpt'
  save_last_ckpt: True
  save_last_snapshot: False

multi_run:
  run_dir: ${output_dir}/${now:%Y.%m.%d}_${now:%H.%M.%S}_${task_name}_${name}
  wandb_name_base: ${now:%Y.%m.%d-%H.%M.%S}_${task_name}_${name}

hydra:
  sweeper:
    _target_: hydra_plugins.hydra_optuna_sweeper.optuna_sweeper.OptunaSweeper
    direction: minimize
    n_trials: 2
    n_jobs: 1
    sampler:
      _target_: optuna.samplers.TPESampler
      seed: 42
    params: {}
  job:
    override_dirname: ${name}
  run:
    dir: ${output_dir}/${now:%Y.%m.%d}_${now:%H.%M.%S}_${task_name}_${name}
  sweep:
    dir: ${output_dir}/${now:%Y.%m.%d}_${now:%H.%M.%S}_${task_name}_${name}
    subdir: ${hydra.job.num}
