defaults:
  - _self_
  - task: flip_up.yaml
  #- task: switch
  - override hydra/sweeper: optuna

name: $_RACP_Baseline_100_demos
output_dir: ${oc.env:PYRITE_CHECKPOINT_FOLDERS}
_target_: diffusion_policy.workspace.train_diffusion_transformer_image_workspace.TrainDiffusionTransformerImageWorkspace

task_name: ${task.name}
shape_meta: ${task.shape_meta}
exp_name: "default"

policy:
  _target_: diffusion_policy.policy.diffusion_transformer_timm_mod1_policy.DiffusionTransformerTimmMod1Policy

  shape_meta: ${shape_meta}

  noise_scheduler:
    _target_: diffusers.DDIMScheduler
    num_train_timesteps: 100
    beta_start: 0.0001
    beta_end: 0.02
    beta_schedule: squaredcos_cap_v2
    clip_sample: True
    set_alpha_to_one: True
    steps_offset: 0
    prediction_type: sample

  obs_encoder:
    _target_: diffusion_policy.model.vision.timm_obs_encoder_bi_cross_dat_transformer.TimmObsEncoderBiCrossDATTransformer
    shape_meta: ${shape_meta}
    fuse_mode: modality-attention  # modality-attention (no modules) | bi-cross-attention | bi-cross-attention-DAT | DAT
    second_camera: false
    reduce_pretrained_lr: True
    position_encoding: learnable
    symbol_retriever: positional  # positional | position_relative | symbolic | relational_symbolic
    symbol_retriever_cfg:
      symbol_dim: 768  # must match v_feature_dim (ViT-B embed_dim)
      n_heads: 6
      n_symbols: 16
    bi_cross_heads: 4
    bi_cross_attn_drop: 0.1   # dropout on the cross-attention weights (img<->force)
    bi_cross_drop: 0.05       # dropout after the cross-attn residual + its FFN
    # RA-only ablation -- DualAttention concatenates self-attn and
    # relational-attn outputs, so the head-count ratio controls what
    # fraction of each DAT block's output dimension comes from relational
    # attention. sa=0 removes ordinary self-attention entirely, so every DAT
    # layer is pure relational attention over the retrieved symbols.
    n_heads_sa: 8
    n_heads_ra: 8
    share_attn_params: False
    dat_n_layers: 4
    dat_dff: 2048
    dat_activation: relu
    dat_dropout_rate: 0.1
    dat_norm_first: True
    dat_ra_kwargs:
      symmetric_rels: True

    # Contact gate (see contact_gate_enabled on the obs_encoder). Constructor
    # arg, not a runtime-settable one like curriculum below
    # -- it decides whether the model even HAS the learnable no-contact
    # placeholder parameter, so old checkpoints (enabled=False, no such
    # parameter) keep loading with strict=True. Runs at train AND eval
    # (unlike curriculum) -- part of the deployed policy.
    # For a clean first experiment, keep curriculum.scheduler: "no"
    # while this is enabled.
    # v4: Schmitt-trigger hysteresis scanned over the observed wrench window
    # (opens above contact_gate_threshold_high, closes below
    # contact_gate_threshold, holds state in between -- see forward() in
    # timm_obs_encoder_bi_cross_dat_transformer.py). Replaces v3 (literal
    # replica of the reference torque-gating repo, diffusion_policy_gating.py /
    # DiffusionPolicyUNetGating -- instantaneous, most recent timestep only,
    # hard threshold, no ramp), which flickered open/closed on sensor noise:
    # the measured free-motion wrench noise floor (~3-5N residual, 2-6N
    # pose-dependent bias uncorrected -- see project_wrench_nn_calib memory)
    # sits right against a single 7N cutoff. Earlier v1 (hard, but comparing
    # against range-normalized [-1,1] wrench instead of raw Newtons -- a bug,
    # not a design choice) was also replaced, not kept as an alternate mode.
    contact_gate_enabled: False
    contact_gate_threshold: 5.0        # N -- closing (lower) bound of the
      # hysteresis band. Literal match to reference's
      # self.algo.gating.contact_force_threshold (diffusion_policy_gating_config.py).
    contact_gate_threshold_high: 7.0  # N -- opening (upper) bound of the
      # hysteresis band.
      # both originally from stiffness_estimation_para in
      # PyriteEnvSuites/scripts/postprocess_add_virtual_target_label_clipped.py

    vision_encoder_cfg:
      model_name: 'vit_base_patch32_clip_224.openai'
      pretrained: True
      frozen: False
      global_pool: ''
      downsample_ratio: 32
      transforms:
        - type: RandomCrop
          ratio: 0.95
        - _target_: torchvision.transforms.ColorJitter
          brightness: 0.3
          contrast: 0.4
          saturation: 0.5
          hue: 0.08
      use_group_norm: True
      share_rgb_model: False

    force_encoder_cfg:
      type: fft
      feature_dim: 384  # must match vision encoder embed_dim so tokens are compatible
      last_n_tokens: 1
      frozen: False
      share_force_model: False

  num_inference_steps: 16
  input_pertub: 0.0684854455525527
  # transformer denoiser architecture
  n_layer: 8
  n_head: 8
  n_emb: 768    # must match vision_encoder_cfg embed_dim and force_encoder_cfg feature_dim
  p_drop_attn: 0.1

curriculum:
  # FACTR-style force-attending visual curriculum (see
  # diffusion_policy/model/vision/curriculum.py). Blurs vision input during
  # training only, decaying to 0 (full detail) by the end of training;
  # predict_action()/eval() are never affected.
  space: pixel      # latent (post-ViT tokens) | pixel (raw image, FACTR's own default)
  scheduler: "no"   # no | const | linear | cos | exp | step -- must stay quoted: bare `no`/`off`/`yes`/`on` parse as YAML booleans
  start_scale: 4.0   # Gaussian sigma at the start of the decay
  end_scale: 0.0

ema:
  _target_: diffusion_policy.model.diffusion.ema_model.EMAModel
  update_after_step: 0
  inv_gamma: 1.0
  power: 0.75
  min_value: 0.0
  max_value: 0.9999

dataloader:
  batch_size: 128   # transformers need more memory per sample than UNet — start lower
  num_workers: 32
  shuffle: True
  pin_memory: True
  persistent_workers: false

val_dataloader:
  batch_size: 128
  num_workers: 32
  shuffle: False
  pin_memory: True
  persistent_workers: false

optimizer:
  _target_: torch.optim.AdamW
  lr: 1.0e-4
  betas: [0.9, 0.95]
  eps: 1.0e-8
  weight_decay: 1.0e-4

training:
  device: "cuda:0"
  seed: 42
  debug: False
  resume: False
  lr_scheduler: cosine
  lr_warmup_steps: 1000
  num_epochs: 150
  log_gradient_norm: False
  gradient_accumulate_every: 1
  use_ema: True
  freeze_encoder: False
  rollout_every: 10
  checkpoint_every: 10
  val_every: 5
  sample_every: 5
  max_train_steps: null
  max_val_steps: null
  tqdm_interval_sec: 1.0

logging:
  project: RACP_SWITCH
  resume: False
  mode: online
  name: ${now:%Y.%m.%d-%H.%M.%S}_${task_name}_${name}
  tags: ["${name}", "${task_name}", "${exp_name}"]
  id: null
  group: null

checkpoint:
  topk:
    monitor_key: val_sparse_naction_mse_error
    mode: min
    k: 20
    format_str: 'epoch={epoch:04d}-train_loss={train_loss:.3f}.ckpt'
  save_last_ckpt: True
  save_last_snapshot: False

multi_run:
  run_dir: ${output_dir}/${now:%Y.%m.%d}_${now:%H.%M.%S}_${task_name}_${name}
  wandb_name_base: ${now:%Y.%m.%d-%H.%M.%S}_${task_name}_${name}

hydra:
  sweeper:
    _target_: hydra_plugins.hydra_optuna_sweeper.optuna_sweeper.OptunaSweeper
    direction: minimize
    n_trials: 2
    n_jobs: 1
    sampler:
      _target_: optuna.samplers.TPESampler
      seed: 42
    params: {}
  job:
    override_dirname: ${name}
  run:
    dir: ${output_dir}/${now:%Y.%m.%d}_${now:%H.%M.%S}_${task_name}_${name}
  sweep:
    dir: ${output_dir}/${now:%Y.%m.%d}_${now:%H.%M.%S}_${task_name}_${name}
    subdir: ${hydra.job.num}
